name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/mma-training-tracker-ad8uo2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One queue per branch, so pushing the same commit to two branches can't cancel the deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # GitHub Pages only accepts deploys from the repo's default branch; other branches just build and test.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
